<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vacancy Categories - Yojana Setu</title>
</head>
<body>
<h1>Vacancy Categories</h1>
<ul>
  {% for category in categories %}
    <li><a href="{% url 'vacancy:vacancy_list' category.slug %}">{{ category.name }}</a></li>
  {% empty %}
    <li>No categories found.</li>
  {% endfor %}
</ul>
</body>
</html>
